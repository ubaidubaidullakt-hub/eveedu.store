<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>Admin Dashboard</h2>
  
  <h3>Add New Seller</h3>
  <form id="sellerForm">
    <input type="text" id="brand" placeholder="Brand Name" required>
    <input type="text" id="owner" placeholder="Owner Name" required>
    <input type="text" id="category" placeholder="Category" required>
    <input type="text" id="district" placeholder="District" required>
    <input type="text" id="phone" placeholder="Phone Number" required>
    <label>
      Verified:
      <input type="checkbox" id="verified">
    </label>
    <button type="submit">Add Seller</button>
  </form>

  <h3>Existing Sellers</h3>
  <ul id="sellersList"></ul>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
